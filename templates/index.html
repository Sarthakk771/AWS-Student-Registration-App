<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 25px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <form action="/register" method="POST">

        <input type="text"
               name="name"
               placeholder="Student Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email"
               required>

        <input type="text"
               name="course"
               placeholder="Course"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <button type="submit">Register Student</button>

    </form>

    <a href="/students">View Registered Students</a>

</div>

</body>
</html>
